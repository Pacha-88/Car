<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>car-tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      // Before first paint, so a light-OS visitor never sees a dark flash:
      // the stylesheet's default is dark and React only applies the
      // attribute after hydration. Same precedence as the app: an explicit
      // stored choice wins, then the OS preference.
      try {
        var theme = localStorage.getItem("car-tracker.theme");
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
