[project]
name = "car-tracker"
version = "0.1.0"
description = "Daily price-tracking dashboard for used Tesla Model Y/3 listings across DE/AT/HU/EU"
readme = "README.md"
authors = [
    { email = "gorfol.gabor@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # curl-cffi carries real browser TLS fingerprints. Tesla.com and
    # Használtautó.hu reject Python's own handshake outright, headers and
    # source IP notwithstanding - see sources/fetch.py.
    "curl-cffi>=0.13",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
# The escalation of last resort: a real browser, which also executes the
# JS challenge a fingerprint alone can't clear. Optional because it costs
# a few hundred MB and most runs never need it.
browser = ["playwright>=1.62.0"]

[project.scripts]
car-tracker = "car_tracker:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
